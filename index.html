  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-card: rgba(255, 255, 255, 0.03);
      --accent-purple: #a78bfa;
      --accent-violet: #8b5cf6;
      --accent-indigo: #6366f1;
      --accent-lavender: #c4b5fd;
      --text-primary: #f5f5f7;
      --text-secondary: #b4b4bb;
      --focus-ring: rgba(167, 139, 250, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      padding: 40px 20px 60px;
      overflow-x: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      background: var(--bg-dark);
    }

    body::before {
      content: '';
      position: fixed;
      inset: -10%;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(167, 139, 250, 0.05) 0%, transparent 60%);
      animation: ambient-float 20s ease-in-out infinite;
    }

    @keyframes ambient-float {
      0%, 100% { transform: translate3d(0, 0, 0); }
      33% { transform: translate3d(1%, 0.5%, 0); }
      66% { transform: translate3d(-0.5%, 1%, 0); }
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10%, 90% { opacity: 0.5; }
      100% { transform: translateY(-100px) scale(1); opacity: 0; }
    }

    @keyframes fade-in { to { opacity: 1; } }
    @keyframes fade-in-up { to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      z-index: 100;
      padding: 8px 16px;
      border-radius: 0 0 8px 0;
      color: white;
      background: var(--accent-purple);
      transition: top 0.3s ease;
    }
    .skip-link:focus { top: 0; }

    .particles { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .particle {
      position: absolute;
      left: var(--left, 50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      opacity: 0;
      background: var(--accent-lavender);
      animation: float var(--duration, 14s) infinite;
      animation-delay: var(--delay, 0s);
    }

    .container { position: relative; z-index: 1; width: 100%; max-width: 420px; }
    .profile { margin-bottom: 36px; text-align: center; opacity: 0; animation: fade-in 0.6s ease forwards; }
    .avatar-wrapper { position: relative; display: inline-block; margin-bottom: 20px; }
    .avatar-glow {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      filter: blur(12px);
      opacity: 0.6;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-purple), var(--accent-indigo));
      animation: pulse-glow 3s ease-in-out infinite;
    }

    .avatar {
      position: relative;
      width: 120px;
      height: 120px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      object-fit: cover;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-purple));
      transition: transform 0.3s ease;
    }
    .avatar:hover { transform: scale(1.05); }

    .username { margin-bottom: 8px; font-size: 1.75rem; font-weight: 700; letter-spacing: 0.5px; }
    .bio { color: var(--accent-lavender); font-size: 1.05rem; font-weight: 600; }

    .tech-stack { display: flex; justify-content: center; gap: 12px; margin-top: 16px; list-style: none; }
    .tech-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.72rem;
      font-weight: 700;
      transition: transform 0.3s ease, color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
    }
    .tech-icon:hover {
      transform: translateY(-2px);
      color: var(--accent-lavender);
      border-color: rgba(167, 139, 250, 0.3);
      background: rgba(167, 139, 250, 0.15);
    }

    .contact-email { margin-top: 14px; }
    .contact-email a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .contact-email a:hover, .contact-email a:focus { color: var(--accent-lavender); }
    .contact-email svg { width: 16px; height: 16px; fill: currentColor; }

    .links { display: flex; flex-direction: column; gap: 14px; }
    .link-item {
      --item-delay: 0.1s;
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      color: var(--text-primary);
      background: var(--bg-card);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      opacity: 0;
      transform: translateY(20px);
      animation: fade-in-up 0.5s ease forwards;
      animation-delay: var(--item-delay);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease, box-shadow 0.3s ease;
      -webkit-tap-highlight-color: rgba(167, 139, 250, 0.2);
    }
    .link-item:nth-child(2) { --item-delay: 0.15s; }
    .link-item:nth-child(3) { --item-delay: 0.2s; }
    .link-item:nth-child(4) { --item-delay: 0.25s; }
    .link-item::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(167, 139, 250, 0.1));
      transition: opacity 0.3s ease;
    }
    .link-item:hover::before, .link-item:focus::before { opacity: 1; }
    .link-item:hover, .link-item:focus {
      transform: translateY(-2px);
      border-color: rgba(167, 139, 250, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(167, 139, 250, 0.1);
    }
    .link-item:focus-visible {
      outline: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 0 3px var(--focus-ring);
    }
    .link-item:active { transform: scale(0.98); }

    .link-icon, .link-arrow, .link-text { position: relative; z-index: 1; }
    .link-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 24px; height: 24px; }
    .link-icon svg { width: 22px; height: 22px; fill: currentColor; }
    .link-text { flex-grow: 1; }
    .link-subtitle { display: block; margin-top: 2px; color: var(--text-secondary); font-size: 0.75rem; font-weight: 500; }
    .link-arrow { opacity: 0.4; transition: transform 0.3s ease, opacity 0.3s ease; }
    .link-item:hover .link-arrow, .link-item:focus .link-arrow { opacity: 0.8; transform: translateX(4px); }

    .telegram:hover, .telegram:focus { border-color: rgba(38, 165, 228, 0.4); }
    .github:hover, .github:focus { border-color: rgba(255, 255, 255, 0.3); }
    .linkedin:hover, .linkedin:focus { border-color: rgba(10, 102, 194, 0.5); }
    .resume:hover, .resume:focus { border-color: rgba(66, 133, 244, 0.5); }

    .footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(255, 255, 255, 0.05); text-align: center; }
    .footer-text { color: var(--text-secondary); font-size: 0.75rem; opacity: 0.5; }

    @media (min-width: 481px) { .container { max-width: 480px; } }
    @media (min-width: 768px) {

    @media (max-width: 320px) {
      .link-item { padding: 12px 14px; gap: 10px; font-size: 0.9rem; }
      .tech-stack { flex-wrap: wrap; }
    }
  </style>
</head>

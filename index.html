  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-card: rgba(255, 255, 255, 0.03);
      --accent-purple: #a78bfa;
      --accent-violet: #8b5cf6;
      --accent-indigo: #6366f1;
      --accent-lavender: #c4b5fd;
      --text-primary: #f5f5f7;
      --text-secondary: #b4b4bb;
      --glow-purple: rgba(167, 139, 250, 0.4);
      --glow-violet: rgba(139, 92, 246, 0.3);
      --focus-ring: rgba(167, 139, 250, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background */
    @keyframes ambientFloat {

      0%,
      100% {
        transform: translate3d(0, 0, 0);
      }

      33% {
        transform: translate3d(1%, 0.5%, 0);
      }

      66% {
        transform: translate3d(-0.5%, 1%, 0);
      }
    }

    body::before {
      content: '';
      position: fixed;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(167, 139, 250, 0.05) 0%, transparent 60%);
      animation: ambientFloat 20s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
      will-change: transform;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--accent-lavender);
      border-radius: 50%;
      opacity: 0;
      animation: float var(--duration, 14s) infinite;
      animation-delay: var(--delay, 0s);
      left: var(--left, 50%);
      will-change: transform;
      backface-visibility: hidden;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }

      10% {
        opacity: 0.5;
      }

      90% {
        opacity: 0.5;
      }

      100% {
        transform: translateY(-100px) scale(1);
        opacity: 0;
      }
    }

    .container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    /* Profile Section */
    .profile {
      text-align: center;
      margin-bottom: 36px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .avatar-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .avatar-glow {
      position: absolute;
      inset: -4px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-purple), var(--accent-indigo));
      border-radius: 50%;
      filter: blur(12px);
      opacity: 0.6;
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {

      0%,
      100% {
        opacity: 0.5;
        transform: scale(1);
      }

      50% {
        opacity: 0.7;
        transform: scale(1.05);
      }
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      position: relative;
      border: 3px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-purple));
    }

    .avatar:hover {
      transform: scale(1.05);
    }

    .avatar-fallback {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      position: relative;
      border: 3px solid rgba(255, 255, 255, 0.1);
      color: white;
      font-weight: 700;
    }

    .username {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .bio {
      font-size: 1.05rem;
      color: var(--accent-lavender);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .bio-heart {
      animation: heartbeat 1.5s ease-in-out infinite;
    }

    @keyframes heartbeat {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    /* Tech Stack */
    .tech-stack {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
      list-style: none;
    }

    .tech-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      transition: all 0.3s ease;
      cursor: default;
    }

    .tech-icon:hover {
      background: rgba(167, 139, 250, 0.15);
      border-color: rgba(167, 139, 250, 0.3);
      transform: translateY(-2px);
    }

    .tech-icon svg {
      width: 20px;
      height: 20px;
      fill: var(--text-secondary);
      transition: fill 0.3s ease;
    }

    .tech-icon:hover svg {
      fill: var(--accent-lavender);
    }

    /* Specific tech colors on hover */
    .tech-stack li:nth-child(1) .tech-icon:hover svg {
      fill: #f7df1e;
    }

    /* JS */
    .tech-stack li:nth-child(2) .tech-icon:hover svg {
      fill: #3178c6;
    }

    /* TS */
    .tech-stack li:nth-child(3) .tech-icon:hover svg {
      fill: #4fc08d;
    }

    /* Vue */
    .tech-stack li:nth-child(4) .tech-icon:hover svg {
      fill: #00dc82;
    }

    /* Nuxt */

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .contact-email {
      margin-top: 14px;
    }

    .contact-email a {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .contact-email a:hover,
    .contact-email a:focus {
      color: var(--accent-lavender);
    }

    .contact-email svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Links Section */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-item {
      --item-delay: 0.1s;
      position: relative;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.5s ease forwards;
      animation-delay: var(--item-delay);
      -webkit-tap-highlight-color: rgba(167, 139, 250, 0.2);
    }

    .link-item:nth-child(1) {
      --item-delay: 0.1s;
    }

    .link-item:nth-child(2) {
      --item-delay: 0.15s;
    }

    .link-item:nth-child(3) {
      --item-delay: 0.2s;
    }

    .link-item:nth-child(4) {
      --item-delay: 0.25s;
    }

    .link-item:nth-child(5) {
      --item-delay: 0.3s;
    }

    .link-item:nth-child(6) {
      --item-delay: 0.35s;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .link-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
          rgba(139, 92, 246, 0.1) 0%,
          rgba(167, 139, 250, 0.1) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .link-item:hover::before,
    .link-item:focus::before {
      opacity: 1;
    }

    .link-item:hover,
    .link-item:focus {
      transform: translateY(-2px);
      border-color: rgba(167, 139, 250, 0.3);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        0 0 0 1px rgba(167, 139, 250, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .link-item:focus {
      outline: none;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        0 0 0 3px var(--focus-ring),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .link-item:focus:not(:focus-visible) {
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        0 0 0 1px rgba(167, 139, 250, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .link-item:focus-visible {
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        0 0 0 3px var(--focus-ring),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .link-item:active {
      transform: scale(0.98);
    }

    .link-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    .link-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .link-item:hover .link-icon svg,
    .link-item:focus .link-icon svg {
      transform: scale(1.1);
    }

    .link-text {
      position: relative;
      z-index: 1;
      flex-grow: 1;
    }

    .link-subtitle {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .link-arrow {
      position: relative;
      z-index: 1;
      opacity: 0.4;
      transition: all 0.3s ease;
    }

    .link-item:hover .link-arrow,
    .link-item:focus .link-arrow {
      opacity: 0.8;
      transform: translateX(4px);
    }

    /* Platform-specific accent colors */
    .link-item.telegram:hover,
    .link-item.telegram:focus {
      border-color: rgba(38, 165, 228, 0.4);
    }

    .link-item.github:hover,
    .link-item.github:focus {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .link-item.linkedin:hover,
    .link-item.linkedin:focus {
      border-color: rgba(10, 102, 194, 0.5);
    }

    .link-item.habr:hover,
    .link-item.habr:focus {
      border-color: rgba(101, 166, 199, 0.5);
    }

    .link-item.resume:hover,
    .link-item.resume:focus {
      border-color: rgba(66, 133, 244, 0.5);
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .footer-text {
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0.5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .heart {
      color: var(--accent-purple);
      animation: heartbeat 1.5s ease-in-out infinite;
    }

    /* ===== RESPONSIVE ===== */

    @media (min-width: 481px) {
      .container {
        max-width: 480px;
      }
    }

    @media (min-width: 768px) {
      body {
        padding: 60px 20px 80px;
      }

      .container {
        max-width: 520px;
      }

      .link-item {
        padding: 18px 24px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 30px 16px 50px;
      }

      .avatar,
      .avatar-fallback {
        width: 100px;
        height: 100px;
      }

      .avatar-fallback {
        font-size: 2.5rem;
      }

      .username {
        font-size: 1.5rem;
      }

      .link-item {
        padding: 14px 16px;
      }

      .tech-stack {
        gap: 12px;
      }

      .tech-icon {
        width: 32px;
        height: 32px;
      }

      .tech-icon svg {
        width: 18px;
        height: 18px;
      }
    }

    @media (max-width: 320px) {
      .container {
        max-width: 100%;
      }

      .link-item {
        padding: 12px 14px;
        gap: 10px;
        font-size: 0.9rem;
      }

      .link-icon svg {
        width: 20px;
        height: 20px;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding: 20px 20px 30px;
      }

      .avatar,
      .avatar-fallback {
        width: 80px;
        height: 80px;
      }

      .profile {
        margin-bottom: 20px;
      }

      .links {
        gap: 10px;
      }

      .link-item {
        padding: 12px 16px;
      }
    }

    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--accent-purple);
      color: white;
      padding: 8px 16px;
      z-index: 100;
      border-radius: 0 0 8px 0;
      transition: top 0.3s;
    }

    .skip-link:focus {
      top: 0;
    }
  </style>
</head>

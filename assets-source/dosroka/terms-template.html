<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$</title>
  <meta name="description" content="Условия использования Telegram-бота DOSROKA и информация об обработке данных.">
  <link rel="canonical" href="https://maxxborer.com/products/dosroka/docs/terms">
  <meta property="og:type" content="article">
  <meta property="og:title" content="$title$">
  <meta property="og:description" content="Условия использования Telegram-бота DOSROKA и информация об обработке данных.">
  <meta property="og:url" content="https://maxxborer.com/products/dosroka/docs/terms">
  <meta property="og:image" content="https://maxxborer.com/products/dosroka/assets/dosroka-wide.jpg">
  <meta property="og:locale" content="ru_RU">
  <style>
    :root { color-scheme: light dark; --bg: #fbfaf7; --text: #272623; --heading: #151513; --link: #145da0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1b1a; --text: #dedcd5; --heading: #faf8f0; --link: #8cc8ff; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 1.125rem/1.68 Georgia, serif; overflow-wrap: anywhere; }
    main { box-sizing: border-box; width: min(100%, 46rem); margin: auto; padding: clamp(1.15rem, 4vw, 2.5rem) clamp(1rem, 4vw, 2rem) 4rem; }
    figure { margin: 0 0 2rem; }
    img { display: block; width: 100%; height: auto; border-radius: .5rem; }
    h1, h2 { color: var(--heading); font-family: system-ui, sans-serif; line-height: 1.2; text-wrap: balance; }
    h1 { margin: 0 0 .75rem; font-size: clamp(1.85rem, 5vw, 2.8rem); letter-spacing: -.035em; }
    h2 { margin: 2.35rem 0 .7rem; font-size: clamp(1.28rem, 3vw, 1.6rem); }
    article > h1 + p { font: .94rem/1.5 system-ui, sans-serif; }
    p, ul { margin: 0 0 1rem; }
    ul { padding-inline-start: 1.35em; }
    li + li { margin-block-start: .55rem; }
    a { color: var(--link); text-underline-offset: .18em; }
    code { font-size: .85em; }
  </style>
</head>
<body>
  <main>
    <figure id="dosroka-cover">
      <img src="/products/dosroka/assets/dosroka-wide.jpg" width="2048" height="537" alt="ДОСРОКА">
    </figure>
    <article id="dosroka-terms">
$body$
    </article>
  </main>
</body>
</html>
